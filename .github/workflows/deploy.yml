name: Deploy to GitHub Pages

# 只在 main 分支推送时部署；也留一个手动触发口子（Actions 页面点 Run workflow）
on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 需要这三项：读代码、写 Pages、用 OIDC 完成部署
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署。不取消进行中的那个——
# 半途取消可能把不完整的产物留在线上。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # withastro/action 内部依次做：setup-node（默认 Node 24，满足 Astro 7 的
      # Node ≥22.12）→ 安装依赖 → 跑 package.json 的 build 脚本 →
      # upload-pages-artifact 上传制品。
      #
      # 注意它跑的就是我们的 build 脚本，即 `astro build && pagefind --site dist`：
      # **搜索索引在 CI 里一并产出**，不需要额外步骤。
      - name: Build with Astro
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
